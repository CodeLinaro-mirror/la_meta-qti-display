# The conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# The recipes/* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes/*/*.bb \
            ${LAYERDIR}/recipes/*/*.bbappend"

BBFILE_COLLECTIONS += "qti-display"
BBFILE_PATTERN_qti-display := "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-display = "12"

LAYERSERIES_COMPAT_qti-display = "dunfell kirkstone scarthgap"
