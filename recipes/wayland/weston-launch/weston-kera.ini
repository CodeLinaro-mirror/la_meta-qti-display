# configuration file for Weston
[core]
idle-time=0
backend=drm-backend.so
repaint-window=10
require-outputs=none
require-input=false

[output]
name=DSI-1
mode=current

[output]
name=DP-1
mode=current

[output]
name=Virtual-1
mode=off

[output]
name=Virtual-2
mode=off

[shell]
clock-format=seconds
startup-animation=none
